
name: manual-lite-ci

on:
  push:
    branches: [ manual-lite, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repo tree (debug)
        shell: bash
        run: |
          pwd
          ls -la
          find . -maxdepth 2 -type f -name "platformio.ini" -print || true
          find . -maxdepth 3 -type f -path "./src/main.cpp" -print || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      # Build 1: apa adanya
      - name: Build#1 (manual-lite)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_build
          pio run -e manual-lite |& tee ci_build/build_1.log

      # Self-heal TIER-2: OLED minimal jika firmware belum ada
      - name: Self-heal TIER-2 (make OLED minimal)
        if: ${{ always() && !hashFiles('.pio/build/manual-lite/firmware.bin') }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::warning::No firmware after Build#1. Creating OLED minimal fallback."
          if [ ! -f platformio.ini ] || ! grep -q '^\[env:manual-lite\]' platformio.ini; then
            cat > platformio.ini <<'EOF'
[env:manual-lite]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  olikraus/U8g2 @ ^2
build_flags =
  -DTRIG_OUT_PIN=26
  -DSW_PIN=27
  -DBUZZER_PIN=19
  -DOLED_SDA=21
  -DOLED_SCL=22
  -DOLED_ADDR=0x3C
  -DPULSE_MS=120
  -DDEBOUNCE_MS=180
EOF
          fi
          mkdir -p src
          if [ ! -f src/main.cpp ]; then
            cat > src/main.cpp <<'EOF'
#include <Arduino.h>
void setup(){}
void loop(){}
EOF
          fi
          pio run -e manual-lite |& tee ci_build/build_2_oled_min.log || true

      # Self-heal TIER-1: BareBlink (tanpa lib apa pun) jika masih belum ada
      - name: Self-heal TIER-1 (BareBlink)
        if: ${{ always() && !hashFiles('.pio/build/manual-lite/firmware.bin') }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::warning::Still no firmware. Falling back to BareBlink."
          cat > platformio.ini <<'EOF'
[env:manual-lite]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
EOF
          mkdir -p src
          cat > src/main.cpp <<'EOF'
#include <Arduino.h>
void setup(){ pinMode(2, OUTPUT); }
void loop(){ digitalWrite(2, !digitalRead(2)); delay(500); }
EOF
          pio run -e manual-lite |& tee ci_build/build_3_bareblink.log || true

      - name: Upload firmware (.bin)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-manual-lite
          path: .pio/build/manual-lite/firmware.bin
          if-no-files-found: ignore

      - name: Bundle Flash ZIP (manual-lite)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          short="$(git rev-parse --short HEAD)"
          bd=".pio/build/manual-lite"
          app="$bd/firmware.bin"
          work="ci_build/bundle"; rm -rf "$work"; mkdir -p "$work"
          if [[ ! -f "$app" ]]; then
            echo "::warning::firmware.bin not found even after ultimate self-healing"
            printf '%s
'               'No firmware produced after 3 attempts.'               'Check runner network / PlatformIO availability.'               > "$work/README_NO_FIRMWARE.txt"
          else
            boot=$(ls "$bd"/bootloader*.bin 2>/dev/null | head -n1 || true)
            part=$(ls "$bd"/*partitions*.bin 2>/dev/null | head -n1 || true)
            app0=$(ls "$bd"/boot_app0*.bin 2>/dev/null | head -n1 || true)
            AR_CORE="$HOME/.platformio/packages/framework-arduinoespressif32"
            [[ -n "${boot:-}" ]] || boot="$AR_CORE/tools/sdk/esp32/bin/bootloader_dio_40m.bin"
            [[ -n "${app0:-}" ]] || app0="$AR_CORE/tools/partitions/boot_app0.bin"
            [[ -n "${part:-}" ]] || part="$AR_CORE/tools/partitions/default.bin"
            for f in "$boot" "$app0" "$part"; do [[ -f "$f" ]] || { echo "::error::Not found: $f"; exit 1; }; done
            cp "$boot" "$work/bootloader.bin"; cp "$part" "$work/partitions.bin"; cp "$app0" "$work/boot_app0.bin"; cp "$app" "$work/firmware.bin"
            printf '%s
'               'ESP32 Flash Bundle (manual-lite — Ultimate Self-Healing)'               '========================================================'               'Offsets:' ''               '  0x1000   bootloader.bin'               '  0x8000   partitions.bin'               '  0xe000   boot_app0.bin'               '  0x10000  firmware.bin'               '' 'Tips:' '- Jika gagal di 921600 bps, gunakan 460800.' '- Tekan EN/RST setelah selesai.'               > "$work/README.txt"
          fi
          (cd ci_build && zip -9 -r "flash-bundle-manual-lite-${short}.zip" bundle)

      - name: Upload Flash Bundle (.zip)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flash-bundle-manual-lite
          path: ci_build/flash-bundle-manual-lite-*.zip

      - name: Upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ci_build/*.log
            ci_build/bundle/*.txt
