    milesburton/DallasTemperature @ ^4.0.5
    robtillaart/ACS712 @ ^0.3.10
    olikraus/U8g2 @ ^2
build_flags =
    -DMOTSMART_NOSAFE=1
    -DSAFETY_NOTIFY_ONLY=1
    -DUI_SMART_MODE=1
    -DLOG_USE_SERIAL=1
    -DCORE_DEBUG_LEVEL=0
    -DPIO_DEF_PIN_ONEWIRE=4
    -DPIO_DEF_PIN_PC817=27
    -DPIO_DEF_PIN_ACS712=34
    -DPIO_DEF_ACS_MV_PER_A=100
    -DPIO_DEF_ACS_VREF=3.3
    -DPIO_DEF_ACS_MAXADC=4095
    -DPIO_DEF_TEMP_MIN_C=0
    -DPIO_DEF_TEMP_MAX_C=85
