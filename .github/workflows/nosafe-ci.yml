name: nosafe-ci

on:
  push:
    branches:
      - main
      - nosafe-dev
    paths-ignore:
      - "**/*.md"
      - "**/README*"
      - "**/CHANGELOG*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio*.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Prepare dirs
        run: mkdir -p ci_build

      - name: Build NOSAFE (minimal)
        run: pio run -e nosafe-minimal | tee ci_build/build_min.log

      - name: Build NOSAFE (full)
        run: pio run -e nosafe-full | tee ci_build/build_full.log

      - name: Collect firmware
        shell: bash
        run: |
          mkdir -p ci_build
          short="$(git rev-parse --short HEAD)"
          shopt -s nullglob
          for b in .pio/build/*/*.bin; do
            envname="$(basename "$(dirname "$b")")"
            cp "$b" "ci_build/firmware-${envname}-${short}.bin"
          done
          echo "Collected bins:"
          ls -l ci_build || true

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-binaries
          path: ci_build/*.bin

      - name: Upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ci_build/*.log

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware-binaries
          path: ci_build
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ci_build/*.bin
