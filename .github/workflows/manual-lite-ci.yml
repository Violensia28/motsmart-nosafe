- name: Build (manual-lite)
  run: |
    set -euo pipefail
    mkdir -p ci_build
    pio run -e manual-lite |& tee ci_build/build_manual.log

- name: Bundle Flash ZIP (manual-lite)
  shell: bash
  run: |
    set -euo pipefail
    short="$(git rev-parse --short HEAD)"
    bd=".pio/build/manual-lite"
    app="$bd/firmware.bin"
    if [[ ! -f "$app" ]]; then
      echo "::error::Missing firmware.bin in $bd"
      echo "Tips: pastikan platformio.ini di root, env [env:manual-lite] benar, dan src/main.cpp ada."
      exit 1
    fi
    boot=$(ls "$bd"/bootloader*.bin 2>/dev/null | head -n1 || true)
    part=$(ls "$bd"/*partitions*.bin 2>/dev/null | head -n1 || true)
    app0=$(ls "$bd"/boot_app0*.bin 2>/dev/null | head -n1 || true)
    AR_CORE="$HOME/.platformio/packages/framework-arduinoespressif32"
    [[ -n "${boot:-}" ]] || boot="$AR_CORE/tools/sdk/esp32/bin/bootloader_dio_40m.bin"
    [[ -n "${app0:-}" ]] || app0="$AR_CORE/tools/partitions/boot_app0.bin"
    [[ -n "${part:-}" ]] || part="$AR_CORE/tools/partitions/default.bin"
    for f in "$boot" "$app0" "$part"; do [[ -f "$f" ]] || { echo "::error::Not found: $f"; exit 1; }; done
    work="ci_build/bundle"; rm -rf "$work"; mkdir -p "$work"
    cp "$boot" "$work/bootloader.bin"; cp "$part" "$work/partitions.bin"
    cp "$app0" "$work/boot_app0.bin"; cp "$app" "$work/firmware.bin"
    printf '%s\n' \
      'ESP32 Flash Bundle (manual-lite — PULSE 120ms + OLED)' \
      '====================================================' \
      'Offsets:' '' \
      '  0x1000   bootloader.bin' \
      '  0x8000   partitions.bin' \
      '  0xe000   boot_app0.bin' \
      '  0x10000  firmware.bin' \
      '' 'Tips:' '- Jika gagal di 921600 bps, gunakan 460800.' '- Tekan EN/RST setelah selesai.' \
      > "$work/README.txt"
    (cd ci_build && zip -9 -r "flash-bundle-manual-lite-${short}.zip" bundle)          tar -C "ci_build" -czf "ci_build/flash-bundle-manual-lite-${short}.tar.gz" bundle
          sha256sum "ci_build/flash-bundle-manual-lite-${short}.tar.gz" | tee "ci_build/flash-bundle-manual-lite-${short}.tar.gz.sha256"
          ls -l ci_build

      - name: Upload Flash Bundle (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: flash-bundle-manual-lite
          path: ci_build/flash-bundle-manual-lite-*.zip

      - name: Upload Flash Bundle (.tar.gz + sha256)
        uses: actions/upload-artifact@v4
        with:
          name: flash-bundle-manual-lite-tgz
          path: |
            ci_build/flash-bundle-manual-lite-*.tar.gz
            ci_build/flash-bundle-manual-lite-*.tar.gz.sha256

      - name: Upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ci_build/*.log
