name: manual-lite-ci

on:
  push:
    branches: [ manual-lite ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio*.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Build MANUAL (manual-lite)
        run: |
          mkdir -p ci_build
          pio run -e manual-lite | tee ci_build/build_manual.log

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-manual-lite
          path: .pio/build/manual-lite/firmware.bin

      - name: Bundle Flash ZIP (manual-lite)
        shell: bash
        run: |
          set -euo pipefail
          short="$(git rev-parse --short HEAD)"
          bd=".pio/build/manual-lite"

          app="$bd/firmware.bin"
          if [[ ! -f "$app" ]]; then
            echo "::error::Missing firmware.bin in $bd"
            exit 1
          fi

          boot=$(ls "$bd"/bootloader*.bin 2>/dev/null | head -n1 || true)
          part=$(ls "$bd"/*partitions*.bin 2>/dev/null | head -n1 || true)
          app0=$(ls "$bd"/boot_app0*.bin 2>/dev/null | head -n1 || true)

          AR_CORE="$HOME/.platformio/packages/framework-arduinoespressif32"
          [[ -n "${boot:-}" ]] || boot="$AR_CORE/tools/sdk/esp32/bin/bootloader_dio_40m.bin"
          [[ -n "${app0:-}" ]] || app0="$AR_CORE/tools/partitions/boot_app0.bin"
          [[ -n "${part:-}" ]] || part="$AR_CORE/tools/partitions/default.bin"

          for f in "$boot" "$app0" "$part"; do
            if [[ ! -f "$f" ]]; then
              echo "::error::File not found: $f"
              exit 1
            fi
          done

          work="ci_build/bundles/manual-lite"
          rm -rf "$work" && mkdir -p "$work"
          cp "$boot" "$work/bootloader.bin"
          cp "$part" "$work/partitions.bin"
          cp "$app0" "$work/boot_app0.bin"
          cp "$app"  "$work/firmware.bin"

          printf '%s\n' \
            'ESP32 Flash Bundle (manual-lite)' \
            '================================' \
            'Gunakan ESP32 Flash Tool (Android) dengan offset:' \
            '' \
            '  0x1000   bootloader.bin' \
            '  0x8000   partitions.bin' \
            '  0xe000   boot_app0.bin' \
            '  0x10000  firmware.bin' \
            '' \
            'Tips:' \
            '- Mode bootloader: tahan BOOT saat mulai flash (atau sesuai board).' \
            '- Jika gagal di 921600 baud, coba 460800.' \
            '- Selesai flash → tekan EN/RST.' \
            > "$work/README.txt"

          (cd "$work" && zip -9 -r "../flash-bundle-manual-lite-${short}.zip" .)
          ls -l ci_build/bundles

      - name: Upload Flash Bundle
        uses: actions/upload-artifact@v4
        with:
          name: flash-bundle-manual-lite
          path: ci_build/bundles/flash-bundle-manual-lite-*.zip

      - name: Upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ci_build/*.log
- name: Test Flash ZIP integrity
        shell: bash
        run: |
          set -e
          zf=$(ls ci_build/bundles/flash-bundle-manual-lite-*.zip)
          unzip -t "$zf"
          unzip -l "$zf"
          sha256sum "$zf"
          - name: Create tar.gz bundle (manual-lite)
        shell: bash
        run: |
          set -e
          short="$(git rev-parse --short HEAD)"
          tar -C ci_build/bundles/manual-lite -czf "ci_build/bundles/flash-bundle-manual-lite-${short}.tar.gz" .
          ls -l ci_build/bundles

      - name: Upload Flash Bundle (tar.gz)
        uses: actions/upload-artifact@v4
        with:
          name: flash-bundle-manual-lite-tgz
          path: ci_build/bundles/flash-bundle-manual-lite-*.tar.gz
