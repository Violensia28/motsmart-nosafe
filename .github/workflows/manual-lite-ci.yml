name: manual-lite-ci

on:
  push:
    branches: [ manual-lite ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build (manual-lite)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_build
          pio run -e manual-lite 2>&1 | tee ci_build/build.log
          test -f .pio/build/manual-lite/firmware.bin

      - name: Upload firmware (.bin)
        uses: actions/upload-artifact@v4
        with:
          name: firmware-manual-lite
          path: .pio/build/manual-lite/firmware.bin

      - name: Bundle Flash ZIP (manual-lite)
        shell: bash
        run: |
          set -euo pipefail
          bd=".pio/build/manual-lite"
          app="$bd/firmware.bin"
          work="ci_build/bundle"
          rm -rf "$work"; mkdir -p "$work"
          cp "$app" "$work/firmware.bin"
          if ls "$bd"/bootloader*.bin >/dev/null 2>&1; then cp "$bd"/bootloader*.bin "$work/bootloader.bin"; fi
          if ls "$bd"/*partitions*.bin >/dev/null 2>&1; then cp "$bd"/*partitions*.bin "$work/partitions.bin"; fi
          if ls "$bd"/boot_app0*.bin >/dev/null 2>&1; then cp "$bd"/boot_app0*.bin "$work/boot_app0.bin"; fi
          (cd ci_build && zip -9 -r "flash-bundle-manual-lite.zip" bundle)

      - name: Upload Flash Bundle (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: flash-bundle-manual-lite
          path: ci_build/flash-bundle-manual-lite.zip

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ci_build/build.log
