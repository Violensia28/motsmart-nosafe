- name: Bundle Flash ZIP (manual-lite)
        shell: bash
        run: |
          set -euo pipefail
          short="$(git rev-parse --short HEAD)"
          bd=".pio/build/manual-lite"

          # 1) Ambil dari salinan hasil step Collect (lebih stabil)
          app="ci_build/firmware-manual-lite-${short}.bin"
          if [[ ! -f "$app" ]]; then
            # 2) Fallback ke lokasi build langsung
            app="$bd/firmware.bin"
          fi

          if [[ ! -f "$app" ]]; then
            echo "::error::Missing firmware.bin (checked ci_build and $bd)"
            echo "Tips: pastikan src/main.cpp ada dan platformio.ini memuat [env:manual-lite]"
            exit 1
          fi

          # Cari file sistem dari folder build; jika tak ada, fallback Arduino core
          boot=$(ls "$bd"/bootloader*.bin 2>/dev/null | head -n1 || true)
          part=$(ls "$bd"/*partitions*.bin 2>/dev/null | head -n1 || true)
          app0=$(ls "$bd"/boot_app0*.bin 2>/dev/null | head -n1 || true)

          AR_CORE="$HOME/.platformio/packages/framework-arduinoespressif32"
          [[ -n "${boot:-}" ]] || boot="$AR_CORE/tools/sdk/esp32/bin/bootloader_dio_40m.bin"
          [[ -n "${app0:-}" ]] || app0="$AR_CORE/tools/partitions/boot_app0.bin"
          [[ -n "${part:-}" ]] || part="$AR_CORE/tools/partitions/default.bin"

          for f in "$boot" "$app0" "$part"; do
            if [[ ! -f "$f" ]]; then
              echo "::error::Not found: $f"
              exit 1
            fi
          done

          work="ci_build/bundles/manual-lite"
          rm -rf "$work" && mkdir -p "$work"
          cp "$boot" "$work/bootloader.bin"
          cp "$part" "$work/partitions.bin"
          cp "$app0" "$work/boot_app0.bin"
          cp "$app"  "$work/firmware.bin"

          printf '%s\n' \
            'ESP32 Flash Bundle (manual-lite)' \
            '================================' \
            'Gunakan ESP32 Flash Tool (Android) dengan offset:' \
            '' \
            '  0x1000   bootloader.bin' \
            '  0x8000   partitions.bin' \
            '  0xe000   boot_app0.bin' \
            '  0x10000  firmware.bin' \
            '' \
            'Tips:' \
            '- Mode bootloader: tahan BOOT saat mulai flash (atau sesuai board).' \
            '- Jika gagal di 921600 baud, coba 460800.' \
            '- Selesai flash → tekan EN/RST.' \
            > "$work/README.txt"

          (cd "$work" && zip -9 -r "../flash-bundle-manual-lite-${short}.zip" .)
          ls -l ci_build/bundles            'ESP32 Flash Bundle (manual-lite)' \
            '================================' \
            'Gunakan ESP32 Flash Tool (Android) dengan offset:' \
            '' \
            '  0x1000   bootloader.bin' \
            '  0x8000   partitions.bin' \
            '  0xe000   boot_app0.bin' \
            '  0x10000  firmware.bin' \
            '' \
            'Tips:' \
            '- Mode bootloader: tahan BOOT saat mulai flash (atau sesuai board).' \
            '- Jika gagal di 921600 baud, coba 460800.' \
            '- Selesai flash → tekan EN/RST.' \
            > "$work/README.txt"

          (cd "$work" && zip -9 -r "../flash-bundle-manual-lite-${short}.zip" .)
          sha256sum "ci_build/bundles/flash-bundle-manual-lite-${short}.zip" \
            | tee "ci_build/bundles/flash-bundle-manual-lite-${short}.zip.sha256"
          ls -l ci_build/bundles

      - name: Upload Flash Bundle (zip)
        uses: actions/upload-artifact@v4
        with:
          name: flash-bundle-manual-lite
          path: |
            ci_build/bundles/flash-bundle-manual-lite-*.zip
            ci_build/bundles/flash-bundle-manual-lite-*.zip.sha256

      # 9) Test ZIP + buat tar.gz alternatif
      - name: Test Flash ZIP integrity
        shell: bash
        run: |
          set -e
          zf=$(ls ci_build/bundles/flash-bundle-manual-lite-*.zip)
          unzip -t "$zf"
          unzip -l "$zf"

      - name: Create tar.gz bundle (manual-lite)
        shell: bash
        run: |
          set -e
          short="$(git rev-parse --short HEAD)"
          tar -C ci_build/bundles/manual-lite -czf "ci_build/bundles/flash-bundle-manual-lite-${short}.tar.gz" .
          sha256sum "ci_build/bundles/flash-bundle-manual-lite-${short}.tar.gz" \
            | tee "ci_build/bundles/flash-bundle-manual-lite-${short}.tar.gz.sha256"
          ls -l ci_build/bundles

      - name: Upload Flash Bundle (tar.gz)
        uses: actions/upload-artifact@v4
        with:
          name: flash-bundle-manual-lite-tgz
          path: |
            ci_build/bundles/flash-bundle-manual-lite-*.tar.gz
            ci_build/bundles/flash-bundle-manual-lite-*.tar.gz.sha256

      # 10) Upload log (selalu)
      - name: Upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ci_build/*.log
