name: manual-lite-ci

on:
  push:
    branches: [ manual-lite ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1) Checkout kode
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Python untuk PlatformIO
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3) Cache pip (opsional)
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 4) Install PlatformIO
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      # 5) Cache PlatformIO packages (hemat waktu build berikutnya)
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio*.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      # 6) Build environment manual-lite
      - name: Build MANUAL (manual-lite)
        run: |
          mkdir -p ci_build
          pio run -e manual-lite | tee ci_build/build_manual.log

      # 7) Upload firmware .bin
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-manual-lite
          path: .pio/build/manual-lite/firmware.bin

      # 8) Upload log (selalu)
      - name: Upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ci_build/*.log
