name: manual-lite-ci

on:
  push:
    branches: [ manual-lite, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install platformio

      # Pastikan berkas ada; tulis file via ANSI-C quoting (tanpa heredoc & tanpa \ lanjutan)
      - name: Ensure project files (ANSI-C printf; no heredoc)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f platformio.ini ]; then
            printf '%s' $'[env:manual-lite]\nplatform = espressif32\nboard = esp32dev\nframework = arduino\nmonitor_speed = 115200\nlib_deps =\n  olikraus/U8g2 @ ^2\nbuild_flags =\n  -DTRIG_OUT_PIN=26\n  -DSW_PIN=27\n  -DBUZZER_PIN=19\n  -DOLED_SDA=21\n  -DOLED_SCL=22\n  -DOLED_ADDR=0x3C\n  -DPULSE_MS=120\n  -DDEBOUNCE_MS=180\n' > platformio.ini
          fi

          mkdir -p src
          if [ ! -f src/main.cpp ]; then
            printf '%s' $'#include <Arduino.h>\n#include <U8g2lib.h>\n#ifndef TRIG_OUT_PIN\n#define TRIG_OUT_PIN 26\n#endif\n#ifndef SW_PIN\n#define SW_PIN 27\n#endif\n#ifndef BUZZER_PIN\n#define BUZZER_PIN 19\n#endif\n#ifndef OLED_SDA\n#define OLED_SDA 21\n#endif\n#ifndef OLED_SCL\n#define OLED_SCL 22\n#endif\n#ifndef OLED_ADDR\n#define OLED_ADDR 0x3C\n#endif\n#ifndef PULSE_MS\n#define PULSE_MS 120\n#endif\n#ifndef DEBOUNCE_MS\n#define DEBOUNCE_MS 180\n#endif\nU8G2_SSD1306_128X64_NONAME_F_HW_I2C u8g2(U8G2_R0, U8X8_PIN_NONE, OLED_SCL, OLED_SDA);\nstatic void beep(uint16_t ms=60){ pinMode(BUZZER_PIN, OUTPUT); digitalWrite(BUZZER_PIN, HIGH); delay(ms); digitalWrite(BUZZER_PIN, LOW); }\nstatic void drawStatus(const char* top, const char* mid, const char* bot){\n  u8g2.clearBuffer();\n  u8g2.setFont(u8g2_font_6x12_tf);\n  u8g2.drawBox(0,0,128,14); u8g2.setDrawColor(0); u8g2.setCursor(2,11); u8g2.print(top); u8g2.setDrawColor(1);\n  u8g2.setFont(u8g2_font_10x20_tf); u8g2.setCursor(4,40); u8g2.print(mid);\n  u8g2.setFont(u8g2_font_6x12_tf);  u8g2.setCursor(4,62); u8g2.print(bot);\n  u8g2.sendBuffer();\n}\nstatic void pulseTimerTrigger(){\n  pinMode(TRIG_OUT_PIN, OUTPUT);\n  digitalWrite(TRIG_OUT_PIN, HIGH);\n  delay(PULSE_MS);\n  digitalWrite(TRIG_OUT_PIN, LOW);\n  pinMode(TRIG_OUT_PIN, INPUT);\n}\nvoid setup(){\n  pinMode(SW_PIN, INPUT_PULLUP);\n  pinMode(TRIG_OUT_PIN, INPUT);\n  pinMode(BUZZER_PIN, OUTPUT); digitalWrite(BUZZER_PIN, LOW);\n  u8g2.setI2CAddress(OLED_ADDR<<1);\n  u8g2.begin(); u8g2.setPowerSave(0);\n  drawStatus(\"TIMER MODE\",\"READY\",\"BTN->TRIG  ENC N/A\");\n}\nvoid loop(){\n  static bool last = true;\n  bool now = digitalRead(SW_PIN);\n  if (last && !now){\n    beep(40);\n    drawStatus(\"TIMER MODE\",\"TRIGGER\",\"PULSE 120 ms\");\n    pulseTimerTrigger();\n    delay(DEBOUNCE_MS);\n    drawStatus(\"TIMER MODE\",\"READY\",\"BTN->TRIG  ENC N/A\");\n  }\n  last = now;\n}\n' > src/main.cpp
          fi

      - name: Build (manual-lite)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_build
          pio run -e manual-lite |& tee ci_build/build.log

      - name: Upload firmware (.bin)
        uses: actions/upload-artifact@v4
        with:
          name: firmware-manual-lite
          path: .pio/build/manual-lite/firmware.bin

      - name: Bundle Flash ZIP (manual-lite)
        shell: bash
        run: |
          set -euo pipefail
          short="$(git rev-parse --short HEAD)"
          bd=".pio/build/manual-lite"
          app="$bd/firmware.bin"

          boot=$(ls "$bd"/bootloader*.bin 2>/dev/null | head -n1 || true)
          part=$(ls "$bd"/*partitions*.bin 2>/dev/null | head -n1 || true)
          app0=$(ls "$bd"/boot_app0*.bin 2>/dev/null | head -n1 || true)
          AR_CORE="$HOME/.platformio/packages/framework-arduinoespressif32"
          [[ -n "${boot:-}" ]] || boot="$AR_CORE/tools/sdk/esp32/bin/bootloader_dio_40m.bin"
          [[ -n "${app0:-}" ]] || app0="$AR_CORE/tools/partitions/boot_app0.bin"
          [[ -n "${part:-}" ]] || part="$AR_CORE/tools/partitions/default.bin"

          work="ci_build/bundle"
          rm -rf "$work"; mkdir -p "$work"
          cp "$boot" "$work/bootloader.bin"
          cp "$part" "$work/partitions.bin"
          cp "$app0" "$work/boot_app0.bin"
          cp "$app"  "$work/firmware.bin"

          printf '%s\n' \
            'ESP32 Flash Bundle (manual-lite — ANSI-C printf)' \
            '===============================================' \
            'Offsets:' '' \
            '  0x1000   bootloader.bin' \
            '  0x8000   partitions.bin' \
            '  0xe000   boot_app0.bin' \
            '  0x10000  firmware.bin' \
            '' 'Tips:' '- Jika gagal di 921600 bps, gunakan 460800.' '- Tekan EN/RST setelah selesai.' \
            > "$work/README.txt"

          (cd ci_build && zip -9 -r "flash-bundle-manual-lite-${short}.zip" bundle)

      - name: Upload Flash Bundle (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: flash-bundle-manual-lite
          path: ci_build/flash-bundle-manual-lite-*.zip

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ci_build/*.log          name: flash-bundle-manual-lite
          path: ci_build/flash-bundle-manual-lite-*.zip

      - name: Upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ci_build/*.log
            ci_build/bundle/*.txt
