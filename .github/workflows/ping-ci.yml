name: ping-ci

on:
  push:
    branches: [ manual-lite ]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanity check (always green)
        shell: bash
        run: |
          set -euo pipefail
          echo "✅ CI is working on branch: $GITHUB_REF"
          echo "UTC time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          mkdir -p ci_build
          printf 'CI OK\n' > ci_build/OK.txt

      - name: Upload OK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-ok
          path: ci_build/OK.txt
